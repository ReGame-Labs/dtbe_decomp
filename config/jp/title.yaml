name: title
sha1: dbd850914b9af7f3e62bc8ae9685cf16dd69a5be
options:
  basename: title
  target_path: assets/jp/bin/title.bin
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/jp/title
  src_path: src/title
  build_path: build/jp

  ld_script_path: build/jp/generated/title.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x8006414C

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt
    - config/jp/symbols_title.txt

  undefined_funcs_auto_path: build/jp/generated/undefined_funcs_auto_title.txt
  undefined_syms_auto_path: build/jp/generated/undefined_syms_auto_title.txt

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  # each source unit keeps its .rodata as one piece in its own order (g++
  # puts tables first, then the strings, then the virtual tables in reverse),
  # not spread over its functions
  migrate_rodata_to_functions: False
  create_data_pads: False

segments:
  - name: title
    type: code
    start: 0x0
    vram: 0x800643E0
    align: 4
    subalign: 4
    subsegments:
      - [0x0, rodata, boot_logo]
      - [0x74, rodata, title_logo]
      - [0x294, rodata, main_menu]
      - [0x418, rodata, chara_select]
      - [0xF24, rodata, memory_card]
      - [0x1994, rodata, guide]
      - [0x1BC8, rodata, ranking]
      - [0x1FF0, rodata, name_entry]
      - [0x20B4, rodata, credits]
      - [0x21BC, rodata, title_0a]
      - [0x21E4, rodata, option]
      - [0x2780, rodata, title_0b]
      - [0x27A8, rodata, title_0c]
      - [0x2978, c, boot_logo]
      - [0x2D90, c, title_logo]
      - [0x5564, c, main_menu]
      - [0x6718, c, chara_select]
      - [0xBF18, c, memory_card]
      - [0xD8D8, c, guide]
      - [0xEFB0, c, ranking]
      - [0xFD50, c, name_entry]
      - [0x12124, c, credits]
