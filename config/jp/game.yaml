name: game
sha1: 52d75f36d56e5de95aaada8fb1dffe830b12d6c3
options:
  basename: game
  target_path: assets/jp/bin/game.bin
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/jp/game
  src_path: src/battle
  build_path: build/jp

  ld_script_path: build/jp/generated/game.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x8006414C

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/jp/symbols.txt
    - config/jp/symbols_game.txt
    - config/jp/imports_game.txt

  undefined_funcs_auto_path: build/jp/generated/undefined_funcs_auto_game.txt
  undefined_syms_auto_path: build/jp/generated/undefined_syms_auto_game.txt

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  # a function's own rodata goes with its assembly; the rest is included by
  # its unit's C (INCLUDE_RODATA) where the original object had it: g++ wrote
  # each function's tables and strings in function order, then the virtual
  # tables in reverse
  migrate_rodata_to_functions: True
  create_data_pads: False

segments:
  - name: game
    type: code
    start: 0x0
    vram: 0x800643E0
    align: 4
    subalign: 4
    subsegments:
      # the overlay's own first word (5; see movie.yaml): game_main's jump table
      # is 8-aligned in its object only from 0x4 on
      - [0x0, rodata, header]
