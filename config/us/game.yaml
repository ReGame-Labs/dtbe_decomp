options:
  basename: game
  target_path: assets/us/bin/game.bin
  base_path: ../..
  platform: psx
  compiler: GCC

  asm_path: asm/us/game
  src_path: src/battle
  build_path: build/us

  ld_script_path: build/us/generated/game.ld

  global_vram_start: 0x80000000
  global_vram_end: 0x80200000

  find_file_boundaries: True
  gp_value: 0x80064128

  generate_asm_macros_files: False

  section_order: [".rodata", ".text", ".data", ".bss"]

  symbol_addrs_path:
    - config/us/symbols.txt
    - config/us/symbols_game.txt

  undefined_funcs_auto_path: build/us/generated/undefined_funcs_auto_game.txt
  undefined_syms_auto_path: build/us/generated/undefined_syms_auto_game.txt

  string_encoding: SHIFT-JIS
  data_string_encoding: SHIFT-JIS
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  ld_bss_is_noload: True

  # a function's own rodata goes with its assembly; the rest is included by
  # its unit's C (INCLUDE_RODATA) where the original object had it: g++ wrote
  # each function's tables and strings in function order, then the virtual
  # tables in reverse
  migrate_rodata_to_functions: True
  create_data_pads: False

